# FinFlow — Nginx Reverse Proxy
# Terminates TLS, enforces security headers, rate-limits upstream services.
# In production, mount a certificate bundle and uncomment the TLS server block.

upstream frontend {
    server frontend:3000;
}

upstream api {
    server api:8080;
}

# ── HTTP → HTTPS redirect (production) ──────────────────
# server {
#     listen 80;
#     server_name finflow.app;
#     return 301 https://$host$request_uri;
# }

# ── HTTPS server (production) ────────────────────────────
# server {
#     listen 443 ssl http2;
#     server_name finflow.app;
#
#     ssl_certificate     /etc/ssl/certs/fullchain.pem;
#     ssl_certificate_key /etc/ssl/private/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
#     ssl_prefer_server_ciphers on;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 10m;

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    server_tokens off;

    # ── Rate limiting zones ─────────────────────────────
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # ── Request size limits ─────────────────────────────
    client_max_body_size 25M;

    # ── Frontend ─────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ──────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        limit_req zone=general burst=5 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # ── Auth endpoints (stricter rate limit) ────────────
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets (long cache) ─────────────────────
    location /_next/static/ {
        proxy_pass http://frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Deny access to sensitive paths ─────────────────
    location ~ /\.git {
        deny all;
        return 404;
    }
    location ~ /\.env {
        deny all;
        return 404;
    }
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}

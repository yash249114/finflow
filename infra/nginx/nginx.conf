# FinFlow — Nginx Reverse Proxy (Production Hardened)
# Terminates TLS 1.3, enforces security headers, rate-limits upstream services.
#
# In production:
#   1. Obtain TLS certificates (Let's Encrypt certbot recommended).
#   2. Mount them at /etc/ssl/certs/fullchain.pem and /etc/ssl/private/privkey.pem.
#   3. Generate DH params: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048
#   4. Mount the dhparam.pem at /etc/ssl/certs/dhparam.pem.

upstream frontend {
    server frontend:3000;
}

upstream api {
    server api:8080;
}

# ── HTTP → HTTPS redirect (production) ──────────────────
server {
    listen 80;
    server_name _;

    # Security headers on the redirect response itself
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# ── HTTPS server (TLS 1.2 + 1.3, modern ciphers) ────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── TLS certificates (mount via docker-compose volumes) ─
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    # ── TLS 1.2 & 1.3 only. No SSLv2/3, no TLS 1.0/1.1. ─
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_conf_command          Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    # ── DH params for forward secrecy ─────────────────────
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    # ── Session management ────────────────────────────────
    ssl_session_cache     shared:SSL:10m;
    ssl_session_timeout   10m;
    ssl_session_tickets   off;

    # ── OCSP Stapling ─────────────────────────────────────
    ssl_stapling          on;
    ssl_stapling_verify   on;
    resolver              1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout      5s;

    # ── HSTS (sent only on HTTPS responses) ───────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security headers ──────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    server_tokens off;

    # ── Secure cookie flags ───────────────────────────────
    proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax; Path=/";
    proxy_cookie_flags ~ secure httponly samesite=lax;

    # ── Rate limiting zones ───────────────────────────────
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # ── Request size limits ───────────────────────────────
    client_max_body_size 25M;

    # ── Frontend ──────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        limit_req zone=general burst=5 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # ── Auth endpoints (stricter rate limit) ──────────────
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets (long cache) ────────────────────────
    location /_next/static/ {
        proxy_pass http://frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Deny access to sensitive paths ────────────────────
    location ~ /\.git {
        deny all;
        return 404;
    }
    location ~ /\.env {
        deny all;
        return 404;
    }
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
